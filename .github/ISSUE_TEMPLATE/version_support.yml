name: WeChat version support
description: Request strict validation of an unsupported official WeChat build
title: "[Version]: Request support for WeChat version "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Never upload WeChat.app, its executable, backups, hook logs, chat data, or account identifiers.
        A diagnostic report is evidence for manual review; it does not automatically enable installation.
  - type: input
    id: version
    attributes:
      label: WeChat version
      placeholder: 4.x.x
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
    validations:
      required: true
  - type: input
    id: architectures
    attributes:
      label: Architectures
      placeholder: arm64, x86_64
    validations:
      required: true
  - type: input
    id: team_id
    attributes:
      label: Signing Team ID
      description: Expected official value is 5A4RE8SF68.
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: Executable SHA-256
    validations:
      required: true
  - type: textarea
    id: feature_matches
    attributes:
      label: Feature match counts
      description: Copy the arm64 and x86_64 signature match counts from the diagnostic report.
      placeholder: |
        arm64: 1
        x86_64: 1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Safe diagnostic report
      description: Paste `ihavealreadyseenit doctor --json` output. Review it before submitting.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach WeChat binaries, backups, logs, chat data, or account data.
          required: true
