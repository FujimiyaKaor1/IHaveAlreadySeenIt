name: Update Homebrew Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify published Release and obtain DMG digest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IS_DRAFT="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          test "$IS_DRAFT" = "false"
          DIGEST="$(gh release view "v$VERSION" --json assets --jq \
            '.assets[] | select(.name == "IHaveAlreadySeenIt-'"$VERSION"'-Community.dmg") | .digest')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Render and audit the Cask
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          scripts/render-homebrew-cask.sh "$VERSION" "$SHA256"
          scripts/verify-homebrew-cask.sh

      - name: Commit the Cask update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$(git status --porcelain -- Casks/ihavealreadyseenit.rb)" ]]; then
            printf 'Cask already contains IHaveAlreadySeenIt %s\n' "$VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ihavealreadyseenit.rb
          git commit -m "Update Homebrew Cask to $VERSION"
          git push origin HEAD:main
