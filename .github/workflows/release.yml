name: Community Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build, test, and package Community artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          scripts/release.sh
          scripts/verify-homebrew-cask.sh dist/Casks/ihavealreadyseenit.rb
      - name: Prepare bilingual release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          DMG_SHA256="$(awk 'NR == 1 { print $1 }' "dist/IHaveAlreadySeenIt-$VERSION-Community.dmg.sha256")"
          cat > dist/release-notes.md <<EOF
          ## IHaveAlreadySeenIt Community v$VERSION — macOS WeChat Anti-Revoke Tool

          IHaveAlreadySeenIt is an open-source macOS WeChat anti-revoke tool. It is not an official WeChat plugin.

          ### Supported environment

          - macOS 14 or later
          - Verified WeChat 4.1.7 (34371) only
          - DMG SHA-256: $DMG_SHA256

          ### 安全说明

          - Community Build 使用 ad-hoc 签名，未经 Apple 公证；首次启动请在 Finder 中右键选择 打开。
          - 工具不读取聊天内容，不上传数据，也不会自动修改未知微信版本。
          - 修改前会保存完整原版微信；需要卸载工具前，请先在 GUI 中选择 恢复原版微信。

          ### Install and feedback

          Download the DMG below, or use the [Homebrew instructions](https://github.com/FujimiyaKaor1/IHaveAlreadySeenIt#homebrew-installation--homebrew).
          Report problems with the [Bug Report template](https://github.com/FujimiyaKaor1/IHaveAlreadySeenIt/issues/new?template=bug_report.yml).
          Request a new verified WeChat build with the [Version Support template](https://github.com/FujimiyaKaor1/IHaveAlreadySeenIt/issues/new?template=version_support.yml).
          EOF
      - name: Mount and verify DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          MOUNT="$(mktemp -d)"
          hdiutil attach -quiet -nobrowse -mountpoint "$MOUNT" "dist/IHaveAlreadySeenIt-$VERSION-Community.dmg"
          test -d "$MOUNT/IHaveAlreadySeenIt.app"
          test -L "$MOUNT/Applications"
          test -f "$MOUNT/首次使用说明.txt"
          test -f "$MOUNT/First Use.txt"
          test -d "$MOUNT/IHaveAlreadySeenIt.app/Contents/Resources/IHaveAlreadySeenIt_IHaveAlreadySeenItApp.bundle"
          test -d "$MOUNT/IHaveAlreadySeenIt.app/Contents/Resources/IHaveAlreadySeenIt_IHaveAlreadySeenItCore.bundle"
          codesign --verify --deep --strict "$MOUNT/IHaveAlreadySeenIt.app"
          scripts/test-app-launch.sh "$MOUNT/IHaveAlreadySeenIt.app"
          hdiutil detach -quiet "$MOUNT"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/IHaveAlreadySeenIt-$VERSION-Community.dmg" \
            "dist/IHaveAlreadySeenIt-$VERSION-Community.dmg.sha256" \
            "dist/IHaveAlreadySeenIt-$VERSION-source.tar.gz" \
            "dist/IHaveAlreadySeenIt-$VERSION-source.tar.gz.sha256" \
            "dist/Casks/ihavealreadyseenit.rb" \
            --draft --title "IHaveAlreadySeenIt Community v$VERSION — macOS WeChat Anti-Revoke Tool" \
            --notes-file dist/release-notes.md --verify-tag
