name: Sync Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Verify published Release and obtain DMG digest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IS_DRAFT="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          test "$IS_DRAFT" = "false"
          DIGEST="$(gh release view "v$VERSION" --json assets --jq \
            '.assets[] | select(.name == "IHaveAlreadySeenIt-'"$VERSION"'-Community.dmg") | .digest')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Check out the personal Tap
        uses: actions/checkout@v5
        with:
          repository: FujimiyaKaor1/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render and audit the Cask
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          scripts/render-homebrew-cask.sh \
            "$VERSION" "$SHA256" "$GITHUB_WORKSPACE/homebrew-tap/Casks/ihavealreadyseenit.rb"
          scripts/verify-homebrew-cask.sh \
            "$GITHUB_WORKSPACE/homebrew-tap/Casks/ihavealreadyseenit.rb"

      - name: Commit the Tap update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$(git -C homebrew-tap status --porcelain -- Casks/ihavealreadyseenit.rb)" ]]; then
            printf 'Tap already contains IHaveAlreadySeenIt %s\n' "$VERSION"
            exit 0
          fi
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/ihavealreadyseenit.rb
          git -C homebrew-tap commit -m "Update IHaveAlreadySeenIt to $VERSION"
          git -C homebrew-tap push origin HEAD:main
